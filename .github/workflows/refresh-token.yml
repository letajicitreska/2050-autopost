name: refresh-ig-token

on:
  schedule:
    - cron: "17 6 1 * *"   # 1. den v měsíci
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Prodloužit platnost tokenu
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NEW_TOKEN_FILE: ${{ runner.temp }}/ig_token
        run: python scripts/refresh_ig_token.py
      - name: Uložit nový token do Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}   # fine-grained PAT jen na toto repo, Secrets: read & write
          NEW_TOKEN_FILE: ${{ runner.temp }}/ig_token
        run: |
          if [ ! -s "$NEW_TOKEN_FILE" ]; then echo "Token se nezměnil."; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "Chybí secret GH_PAT, nový token nejde uložit."; rm -f "$NEW_TOKEN_FILE"; exit 1; fi
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$NEW_TOKEN_FILE"
          rm -f "$NEW_TOKEN_FILE"
          echo "IG_ACCESS_TOKEN aktualizován."
      - name: Upozornit na selhání
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: Obnova IG tokenu selhala" -H "Priority: high" -H "Tags: warning" -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" -d "Autopost se bez tokenu do pár dnů zastaví. Ťukni pro detail." "https://ntfy.sh/$NTFY_TOPIC" || true
