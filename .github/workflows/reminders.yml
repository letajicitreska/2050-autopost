name: reminders

on:
  push:
    branches: [main]
    paths: ["plan/reminders.json"]
  schedule:
    - cron: "*/10 * * * *"   # GitHub může běh zdržet o několik minut
  workflow_dispatch:

concurrency:
  group: reminders
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # běh až ~5 h čeká na přesný čas připomínky
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Poslat splatné připomínky
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WAIT_MIN: ${{ github.event_name == 'schedule' && '320' || '0' }}
        run: python scripts/reminders.py
      - name: Uložit stav
        if: always()
        run: |
          git config user.name "2050-autopost"
          git config user.email "autopost@users.noreply.github.com"
          git add plan/reminders.json
          if ! git diff --cached --quiet; then
            git commit -m "reminders: odesláno"
            git pull --rebase origin main
            git push
          fi
